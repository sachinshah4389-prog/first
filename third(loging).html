<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Practice</title>
    <link rel="stylesheet" href="style_3.css">
     <!-- font-awesome -->
    
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>

<body>

    <div class="login-box">

        <h1>Login</h1>
        

        <div class="input-group">
            <label for="email">Email</label>
            <input Required type="email" id="email" placeholder="Enter your email">
            <h5 id="span_email"></h5>

        </div>

        <div class="input-group">
            <label for="password">Password</label>

            <div class="password-box">
                <input type="password" id="password" placeholder="Enter password">
                <!-- <h5> incorrect pasword </h5> -->
                <h5 id="strength"></h5>
               <i class="fa-solid fa-eye-slash" id="showPassword" style=" cursor: pointer"  ></i>
            </div>

            <div class="conferm_pass">
                <input type="password" id="confer_password" placeholder="conferm password">
                <h5 id="strength_pass"></h5>
               <i class="fa-solid fa-eye-slash"   id="show_con_Password" style=" cursor: pointer" ></i>
              
            </div>

        </div>

        <button id="login">Login</button>

        <p id="message"></p>

    </div>



    <script src="script_3.js"></script>
</body>

</html>
